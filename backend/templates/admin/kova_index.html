{% extends "admin/index.html" %}

{% block extrastyle %}
{{ block.super }}
<style>
  .kova-board {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 12px;
    margin-bottom: 24px;
  }
  .kova-board a {
    display: block;
    padding: 14px 16px;
    border-radius: 8px;
    background: #176b4d;
    color: #fff;
    text-decoration: none;
  }
  .kova-board a:hover,
  .kova-board a:focus {
    background: #0f4d37;
    color: #fff;
  }
  .kova-board strong {
    display: block;
    font-size: 22px;
    line-height: 1.2;
  }
  .kova-board span {
    display: block;
    margin-top: 4px;
    font-size: 12px;
    letter-spacing: 0.02em;
  }
</style>
{% endblock %}

{% block content %}
<div class="kova-board">
  {% for item in kova_stats %}
  <a href="{{ item.href }}">
    <strong>{{ item.value }}</strong>
    <span>{{ item.label }}</span>
  </a>
  {% endfor %}
</div>
{{ block.super }}
{% endblock %}
