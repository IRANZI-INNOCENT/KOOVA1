services:
  postgres:
    image: postgres:17
    container_name: kova_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: kova
      POSTGRES_USER: kova
      POSTGRES_PASSWORD: kova
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:8
    container_name: kova_redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  postgres_data: